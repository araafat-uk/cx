const R={req:v=>!!v,reg:v=>/^\d{5,12}$/.test(v),rm:v=>/^\d{5,12}$/.test(v)||/^[^@\s]+@student\.aast\.edu$/i.test(v),ph:v=>/^\+?\d{10,15}$/.test(v.replace(/[\s-]/g,'')),pw:v=>v.length>=6,em:v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v),pr:v=>/^\d+(\.\d+)?$/.test(v)};
